<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quản lý văn bản</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
:root{--blue:#2563eb;--blue2:#3b82f6;--green:#10b981;--red:#ef4444;--text:#1f2937;--muted:#6b7280;--border:#e5e7eb;--bg:#f3f6fa}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:"Inter","Segoe UI",Roboto,Arial,sans-serif;font-size:14px;color:var(--text);background:var(--bg)}
button,input,select,textarea{font-family:inherit}
.hidden{display:none!important}
/* header */
header.top{background:#fff;display:flex;justify-content:space-between;align-items:center;padding:8px 16px;gap:10px;flex-wrap:wrap}
.brand{display:flex;gap:12px;align-items:center}
.logo{width:30px;height:30px;border-radius:6px;background:var(--blue);color:#fff;font-weight:800;font-size:12px;display:flex;align-items:center;justify-content:center;flex:none}
.brand b{display:block;font-size:14px;letter-spacing:.2px}
.brand small{color:var(--muted);font-size:12px}
.hbtns{display:flex;gap:6px;flex-wrap:wrap}
.btn{border:1px solid var(--border);background:#f8fafc;color:var(--text);border-radius:6px;padding:6px 12px;font-size:13px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;line-height:1.3}
.btn:hover{filter:brightness(.96)}
.btn:disabled{opacity:.55;cursor:not-allowed}
.btn-yellow{background:#fefce8;border-color:#fcd34d;color:#a16207}
.btn-exit{color:#dc2626}
.btn-blue{background:var(--blue);border-color:var(--blue);color:#fff}
.btn-green{background:#10b981;border-color:#10b981;color:#fff;font-weight:600}
.btn-red{background:#ef4444;border-color:#ef4444;color:#fff;font-weight:600}
.btn-reset{background:#fff1f2;border-color:#fecdd3;color:#e11d48;width:100%;justify-content:center;padding:7px}
.btn-sm{padding:4px 10px;font-size:12.5px}
/* tabs */
nav.tabs{background:#fff;display:flex;gap:2px;padding:0 12px;border-top:1px solid #f1f5f9;border-bottom:1px solid var(--border);box-shadow:0 2px 3px rgba(0,0,0,.03);overflow-x:auto}
nav.tabs button{background:none;border:0;padding:10px 12px;font-size:13.5px;color:#374151;cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap}
nav.tabs button.active{color:var(--blue);border-bottom-color:var(--blue);font-weight:600}
main{padding:14px 12px 30px;max-width:1440px;margin:0 auto}
.card{background:#fff;border:1px solid var(--border);border-radius:8px;padding:14px;margin-bottom:12px}
.card h3{margin:0 0 12px;font-size:13px;letter-spacing:.5px;text-transform:uppercase;color:#374151}
/* dashboard */
.storage .row1{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.storage .note{font-style:italic;color:var(--muted);font-size:12px}
.bar{height:8px;background:#e5e7eb;border-radius:99px;margin-top:10px;overflow:hidden}
.bar>div{height:100%;background:var(--green);border-radius:99px;min-width:14px;transition:width .4s}
code.mono{font-family:Consolas,"Courier New",monospace;color:#1d4ed8;font-weight:600;font-size:13px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:12px}
.stat{background:#fff;border:1px solid var(--border);border-radius:8px;padding:14px;display:flex;justify-content:space-between;align-items:center}
.stat .lbl{font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.6px;text-transform:uppercase}
.stat .num{font-size:20px;font-weight:700;margin-top:4px}
.stat .ico{font-size:20px}
.charts{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.chart-box{position:relative;height:215px}
/* list */
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.search{flex:1;min-width:240px;position:relative}
.search input{width:100%;padding:7px 10px 7px 32px;border:1px solid #cbd5e1;border-radius:6px;font-size:13px}
.search:before{content:"🔍";position:absolute;left:10px;top:6px;font-size:12px}
.filters{display:grid;grid-template-columns:repeat(6,1fr) 1fr;gap:10px;margin-top:12px;align-items:end}
.filters label{display:block;font-size:11px;font-weight:600;color:#4b5563;text-transform:uppercase;margin-bottom:4px}
.filters select,.filters input{width:100%;padding:6px 8px;border:1px solid #9ca3af;border-radius:5px;font-size:13px;background:#fff;height:32px}
.infobox{background:#eff6ff;border:1px solid #bfdbfe;border-radius:8px;padding:12px;margin-bottom:12px}
.infobox .r{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.infobox input{padding:5px 8px;border:1px solid #93c5fd;border-radius:5px;font-family:Consolas,monospace;width:180px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.chip{background:#fff;border:1px solid #cbd5e1;border-radius:5px;padding:4px 10px;font-size:13px;cursor:pointer}
.chip b{color:#1d4ed8}
.chip.on{border-color:var(--blue);background:#dbeafe}
.struct{font-size:12px;color:#1e3a8a}
.infobox .r .struct{margin-left:6px;padding-left:12px;border-left:1px solid #bfdbfe}
.infobox .chips{margin-bottom:0}
.struct code{font-family:Consolas,monospace;color:#1d4ed8}
.small-note{font-size:12px;color:#475569;font-style:italic;margin-top:4px}
.total{color:var(--muted);margin:4px 2px 8px}
.tablewrap{background:#fff;border:1px solid var(--border);border-radius:8px;overflow:auto;max-height:calc(100vh - 300px);min-height:260px}
table.grid{width:100%;border-collapse:collapse;font-size:13.5px}
table.grid th{position:sticky;top:0;background:#f9fafb;font-size:12px;text-transform:uppercase;color:#374151;text-align:left;padding:12px 8px;border-bottom:1px solid var(--border);font-weight:700;letter-spacing:.3px;z-index:1}
table.grid td{padding:11px 8px;border-bottom:1px solid #f0f2f5;vertical-align:middle}
table.grid tr:hover td{background:#fafcff}
.sovb{font-weight:700;min-width:90px}
.pill{font-family:Consolas,monospace;font-size:11.5px;background:#eef4ff;border:1px solid #dbe5ff;color:#1e3a8a;border-radius:4px;padding:2px 6px;white-space:nowrap}
.loai{font-weight:700;margin-bottom:3px}
.ty{color:#6b7280;font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:330px}
.fl{display:block;max-width:130px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#1d4ed8;cursor:pointer;font-size:12.5px;text-decoration:none}
.fl.off{color:#9ca3af;cursor:default}
.act{white-space:nowrap}
.act a{margin-right:10px;cursor:pointer;text-decoration:none}
.act .e{color:#2563eb}.act .d{color:#dc2626}
.badge{display:inline-block;border:1px solid #fca5a5;background:#fff1f2;color:#dc2626;font-weight:700;font-size:11px;padding:2px 8px;border-radius:4px;white-space:nowrap}
.soden{color:#1d4ed8;font-weight:700}
.muted{color:#9ca3af}
.pager{display:flex;justify-content:flex-end;gap:8px;align-items:center;margin-top:8px;color:var(--muted)}
.empty{padding:40px;text-align:center;color:var(--muted)}
/* settings */
.set-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.field{margin-bottom:10px}
.field label{display:block;font-size:12px;font-weight:600;color:#4b5563;margin-bottom:4px}
.field input,.field select,.field textarea{width:100%;padding:7px 9px;border:1px solid #cbd5e1;border-radius:6px;font-size:13.5px;background:#fff}
.field textarea{min-height:70px;resize:vertical}
.field input[readonly]{background:#f8fafc;color:#334155}
/* settings – sub tabs */
.set-wrap{display:grid;grid-template-columns:270px minmax(0,1fr);gap:16px;align-items:start}
.set-nav{background:#fff;border:1px solid var(--border);border-radius:10px;padding:8px;position:sticky;top:12px}
.set-nav .nh{font-size:11px;text-transform:uppercase;color:var(--muted);font-weight:700;letter-spacing:.7px;padding:8px 10px 6px}
.set-nav button{display:flex;gap:11px;align-items:center;width:100%;text-align:left;border:0;background:none;padding:9px 10px;border-radius:8px;cursor:pointer;color:#334155;font-size:13.5px;line-height:1.3;position:relative}
.set-nav button:hover{background:#f8fafc}
.set-nav button .ic{width:32px;height:32px;border-radius:8px;background:#f1f5f9;display:flex;align-items:center;justify-content:center;flex:none;font-size:15px}
.set-nav button small{display:block;color:var(--muted);font-size:11.5px;font-weight:400;margin-top:2px}
.set-nav button.on{background:#eff6ff;color:#1d4ed8;font-weight:600}
.set-nav button.on:before{content:"";position:absolute;left:0;top:10px;bottom:10px;width:3px;border-radius:3px;background:var(--blue)}
.set-nav button.on .ic{background:#dbeafe}
.set-nav .dot{width:8px;height:8px;border-radius:50%;margin-left:auto;flex:none;background:#f59e0b}
.set-nav .dot.ok{background:#10b981}
.sx-panel{background:#fff;border:1px solid var(--border);border-radius:10px;overflow:hidden}
.sx-head{padding:16px 20px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.sx-head h2{margin:0;font-size:16px;color:#0f172a}
.sx-head p{margin:4px 0 0;color:var(--muted);font-size:13px;max-width:680px}
.sx-body{padding:18px 20px}
.sx-foot{padding:12px 20px;border-top:1px solid var(--border);background:#f8fafc;display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;align-items:center}
.sx-foot .left{margin-right:auto;display:flex;gap:8px;flex-wrap:wrap}
.sx-sec{font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:#64748b;margin:0 0 12px;padding-bottom:7px;border-bottom:1px solid #f1f5f9}
.sx-sec + *{margin-top:0}
.sx-gap{height:14px}
.stag{display:inline-flex;gap:6px;align-items:center;font-size:12px;padding:4px 10px;border-radius:99px;font-weight:600;white-space:nowrap}
.stag.on{background:#ecfdf5;color:#047857;border:1px solid #a7f3d0}
.stag.off{background:#fff7ed;color:#c2410c;border:1px solid #fed7aa}
.steps{margin:0;padding-left:18px;font-size:13px;color:#334155;line-height:1.7}
.ma-prev{margin-top:6px;font-size:12px;color:#475569;background:#f8fafc;border:1px dashed #cbd5e1;border-radius:6px;padding:7px 10px;overflow-x:auto;white-space:nowrap}
.ma-prev code{font-family:Consolas,monospace;color:#1d4ed8;font-weight:600}
.acc{display:flex;gap:14px;align-items:center;border:1px solid var(--border);border-radius:8px;padding:12px 14px;background:#fbfdff;flex-wrap:wrap}
.acc .av{width:42px;height:42px;border-radius:50%;background:var(--blue);color:#fff;font-weight:700;display:flex;align-items:center;justify-content:center;font-size:15px;flex:none}
.acc .who{flex:1;min-width:180px}
.acc .who b{display:block;font-size:14px}
.acc .who span{color:var(--muted);font-size:12.5px}
.dm-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.dm-col{border:1px solid var(--border);border-radius:8px;padding:12px;background:#fbfdff;display:flex;flex-direction:column}
.dm-col .dmh{display:flex;justify-content:space-between;align-items:center}
.dm-col .cnt{font-size:11.5px;font-weight:600;color:#1d4ed8;background:#eff6ff;border:1px solid #dbeafe;border-radius:99px;padding:1px 8px}
.dm-col .dmlist{min-height:34px}
.lm-wrap{border:1px solid var(--border);border-radius:8px;overflow:auto;max-height:calc(100vh - 320px)}
.lm-wrap table.mini th{position:sticky;top:0;background:#f8fafc;padding:10px 8px;border-bottom:1px solid var(--border);z-index:1}
.lm-wrap table.mini td{padding:5px 8px;border-bottom:1px solid #f1f5f9}
.lm-wrap table.mini td.no{color:var(--muted);font-size:12px;text-align:center;width:36px}
.lm-wrap table.mini input:focus,.sx-body input:focus,.sx-body select:focus{outline:none;border-color:var(--blue2);box-shadow:0 0 0 3px rgba(59,130,246,.15)}
@media (max-width:900px){.set-wrap{grid-template-columns:1fr}.set-nav{position:static;display:flex;gap:4px;overflow-x:auto}.set-nav .nh,.set-nav button small,.set-nav .dot{display:none}.set-nav button{width:auto;white-space:nowrap;padding:8px 10px}.set-nav button .ic{width:26px;height:26px;font-size:13px}.set-nav button.on:before{left:10px;right:10px;top:auto;bottom:0;width:auto;height:2px}.dm-grid{grid-template-columns:1fr}}
table.mini{width:100%;border-collapse:collapse;font-size:13px}
table.mini th{font-size:11px;text-transform:uppercase;color:#6b7280;text-align:left;padding:6px}
table.mini td{padding:4px}
table.mini input{width:100%;padding:5px 7px;border:1px solid #d1d5db;border-radius:5px;font-size:13px}
.ok{color:#059669}.err{color:#dc2626}
/* modal */
.modal-bg{position:fixed;inset:0;background:rgba(15,23,42,.45);display:flex;align-items:flex-start;justify-content:center;padding:30px 12px;z-index:50;overflow:auto}
.modal{background:#fff;border-radius:10px;width:100%;max-width:820px;box-shadow:0 20px 50px rgba(0,0,0,.25)}
.modal.sm{max-width:520px}
.modal.form{max-width:680px}
.modal.form .mh b{font-size:14px;letter-spacing:.3px}
.modal.form .mb{padding:18px 18px 6px}
.modal.form .field label{font-size:12.5px;color:#374151}
.modal.form .field input,.modal.form .field select{height:34px}
.modal.form .field textarea{min-height:52px}
.modal.form .mf{flex-wrap:nowrap;padding:12px 18px 16px;border-top:0}
.btn-save{flex:1;justify-content:center;padding:10px;font-size:14.5px;font-weight:600}
.btn-close{padding:10px 18px;font-size:14px;background:#f1f5f9}
.sp{display:flex;gap:6px;align-items:center}
.sp select,.sp input{flex:1;min-width:0}
.sp input[data-dmin]{height:32px;padding:6px 9px;border:1px solid #cbd5e1;border-radius:6px;font-size:13.5px}
.plus{width:32px;height:32px;flex:none;border:1px solid #dbeafe;background:#eff6ff;color:#2563eb;border-radius:6px;font-weight:700;font-size:15px;cursor:pointer}
.plus:hover{background:#dbeafe}
.plus.regen{width:40px;height:34px;background:#f1f5f9;border-color:#e2e8f0;color:#475569}
.lblrow{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:4px}
.lblrow label{margin:0}
.lb-blue{color:#1d4ed8!important;font-weight:700!important}
.hint{font-size:11.5px;color:#6b7280}
.mono-inp{font-family:Consolas,monospace}
.soden-inp{color:#1d4ed8;font-weight:700}
.domat{color:#dc2626;font-weight:700}
.fsec{border-top:1px solid #e5e7eb;margin-top:6px;padding-top:12px}
.fhead{display:flex;justify-content:space-between;align-items:center}
.fhead b{font-size:12.5px;color:#334155;letter-spacing:.3px}
.addf{color:#1d4ed8;background:#eff6ff;border-color:#bfdbfe;font-weight:600}
.frow{display:flex;gap:10px;align-items:center;border:1px solid #e2e8f0;background:#f8fafc;border-radius:6px;padding:8px 10px;margin-top:8px}
.frow input[type=file]{flex:1;min-width:0;border:1px solid #cbd5e1;border-radius:6px;padding:4px;background:#fff;font-size:13px}
.frow .fx{border:0;background:none;color:#dc2626;font-size:18px;cursor:pointer;width:24px}
.dmh{font-weight:600;font-size:13px;margin-bottom:6px}
.dmlist{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.dmchip{display:inline-flex;align-items:center;gap:4px;background:#f1f5f9;border:1px solid #e2e8f0;border-radius:99px;padding:3px 4px 3px 10px;font-size:12.5px}
.dmchip button{border:0;background:none;color:#dc2626;cursor:pointer;font-size:14px;line-height:1}
.fg-title{font-weight:700;font-size:15px;margin-bottom:8px}
.auth-links{display:flex;justify-content:center;margin-top:6px}
.modal .mh{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid var(--border)}
.modal .mh b{font-size:15px}
.modal .mh .x{border:0;background:none;font-size:20px;cursor:pointer;color:#64748b}
.modal .mb{padding:16px 18px}
.modal .mf{padding:12px 18px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:0 12px}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:0 12px}
.filelist div{display:flex;justify-content:space-between;gap:8px;padding:5px 8px;border:1px solid #e2e8f0;border-radius:5px;margin-top:5px;font-size:13px}
.filelist .rm{color:#dc2626;cursor:pointer;border:0;background:none}
.filelist .del{text-decoration:line-through;color:#9ca3af}
.warn{background:#fff7ed;border:1px solid #fed7aa;color:#9a3412;padding:8px 10px;border-radius:6px;font-size:13px;margin-bottom:10px}
.info{background:#eff6ff;border:1px solid #bfdbfe;color:#1e3a8a;padding:8px 10px;border-radius:6px;font-size:13px;margin-bottom:10px}
.prog{height:10px;background:#e5e7eb;border-radius:99px;overflow:hidden;margin:8px 0}
.prog>div{height:100%;width:0;background:var(--blue2);transition:width .2s}
.log{max-height:140px;overflow:auto;font-size:12px;color:#b91c1c;margin-top:6px}
.radio{display:flex;gap:8px;align-items:flex-start;padding:8px 10px;border:1px solid #e2e8f0;border-radius:6px;margin-bottom:6px;cursor:pointer}
.radio input{margin-top:3px}
/* auth */
.auth-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.auth{background:#fff;border:1px solid var(--border);border-radius:12px;padding:26px;width:100%;max-width:400px;box-shadow:0 10px 30px rgba(15,23,42,.06)}
.auth .brand{margin-bottom:18px}
.auth .seg{display:flex;background:#f1f5f9;border-radius:8px;padding:3px;margin-bottom:16px}
.auth .seg button{flex:1;border:0;background:none;padding:8px;border-radius:6px;cursor:pointer;font-weight:600;color:#475569}
.auth .seg button.on{background:#fff;color:var(--blue);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.auth .btn{width:100%;justify-content:center;padding:9px}
.auth .link{color:var(--blue);cursor:pointer;font-size:13px;background:none;border:0;padding:0;margin-top:10px}
.demo{background:#fefce8;border:1px solid #fde68a;color:#854d0e;font-size:12.5px;padding:8px 10px;border-radius:6px;margin-bottom:14px}
.demo-bar{background:#fefce8;color:#854d0e;font-size:12.5px;text-align:center;padding:5px;border-bottom:1px solid #fde68a}
/* toast */
#toasts{position:fixed;right:14px;bottom:14px;display:flex;flex-direction:column;gap:8px;z-index:99}
.toast{background:#1e293b;color:#fff;padding:10px 14px;border-radius:8px;font-size:13px;max-width:380px;box-shadow:0 8px 20px rgba(0,0,0,.2)}
.toast.err{background:#b91c1c}.toast.ok{background:#047857}
.loading{padding:40px;text-align:center;color:var(--muted)}
@media (max-width:1000px){.filters{grid-template-columns:repeat(3,1fr)}.stats{grid-template-columns:repeat(2,1fr)}.charts,.set-grid{grid-template-columns:1fr}}
@media (max-width:640px){.filters,.g2,.g3,.g4{grid-template-columns:1fr 1fr}.stats{grid-template-columns:1fr 1fr}.ty{max-width:220px}}
</style>
</head>
<body>
<div id="authView" class="hidden"></div>

<div id="appView" class="hidden">
  <div id="demoBar" class="demo-bar hidden">⚠️ Đang chạy <b>chế độ dùng thử</b> (dữ liệu chỉ lưu trên trình duyệt này). Điền SUPABASE_URL / SUPABASE_ANON_KEY trong file để dùng thật.</div>
  <header class="top">
    <div class="brand"><div class="logo">VB</div><div><b>QUẢN LÝ VĂN BẢN</b><small id="userName"></small></div></div>
    <div class="hbtns">
      <button class="btn btn-yellow" id="btnFree">🧹 Giải phóng dung lượng</button>
      <a class="btn hidden" id="btnGit" target="_blank" rel="noopener">🐙 GitHub</a>
      <button class="btn btn-exit" id="btnLogout">🚪 Thoát</button>
    </div>
  </header>
  <nav class="tabs" id="tabs">
    <button data-tab="dashboard">📊 Dashboard</button>
    <button data-tab="di">📤 Văn bản đi</button>
    <button data-tab="den">📥 Văn bản đến</button>
    <button data-tab="mat">🔒 Văn bản mật</button>
    <button data-tab="key">⚙️ Cài đặt</button>
  </nav>

async function pool(items, n, fn, onProgress, isCancelled) {
  let i = 0, done = 0;
  const worker = async () => {
    while (i < items.length) {
      if (isCancelled && isCancelled()) return;
      const it = items[i++];
      try { await fn(it); } catch (e) { it.error = e.message || String(e); }
      done++; onProgress && onProgress(done, items.length);
    }
  };

}

  async download(id) { const j = await this.call({ action: 'download', id }); return j.blob ? j.blob : b64ToBlob(j.data, j.mime); },
  async remove(id) { return this.call({ action: 'delete', id }); },
  async quota() { return this.call({ action: 'quota' }); },
  async ping() { return this.call({ action: 'ping' }); },
  async demo(p) {
    await sleep(60);

    if (p.action === 'download') return { ok: true, blob: demoBlobs.get(p.id) || new Blob(['Tệp minh họa – chế độ dùng thử.\nKhi dùng thật, tệp gốc được tải từ Google Drive.'], { type: 'text/plain' }) };
    if (p.action === 'delete') { demoBlobs.delete(p.id); return { ok: true, permanent: true }; }
    if (p.action === 'quota') return { ok: true, used: 2.1 * 1024 ** 3, limit: 15 * 1024 ** 3 };
    return { ok: true, uid: 'demo' };
  }
};

const loaiList = () => (Array.isArray(S.settings.loai_map) && S.settings.loai_map.length) ? S.settings.loai_map : DEFAULT_LOAI;
const loaiInfo = ten => loaiList().find(x => x.ten === ten) || { ten, viet_tat: '', pl: '01', dvbq: '0001', ky_hieu: 'MTTQ-BTT' };
const maCQ = () => S.settings.ma_co_quan || CONFIG.DEFAULT_MA_CO_QUAN;
const prefs = () => S.settings.prefs || {};
function makeMa(d) {
  if (!d.so) return '';
  const L = loaiInfo(d.loai_vb);
  return `${maCQ()}-${pad(d.pl || L.pl, 2)}-${pad(d.dvbq || L.dvbq, 4)}-${pad(d.so, 3)}-${L.viet_tat || 'VB'}-${pad(d.so, 4)}-${d.nam}`;
}
async function ensureDocs(kind, force) {
  if (!S.docs[kind] || force) S.docs[kind] = await API.listDocs(kind);
  return S.docs[kind];
}
function nextSo(kind, nam, loai) {
  const list = S.docs[kind] || [];
  if (kind === 'di') return Math.max(0, ...list.filter(d => d.nam == nam && d.loai_vb === loai).map(d => +d.so || 0)) + 1;
  if (kind === 'den') return Math.max(0, ...list.filter(d => d.nam == nam).map(d => +d.so_den || 0)) + 1;
  return '';
}
function sortRows(kind, rows, asc) {
  const k = KIND[kind].dateKey; const dir = asc ? 1 : -1;
  return rows.slice().sort((a, b) => {
    if (a.nam !== b.nam) return (a.nam - b.nam) * dir;
    if (kind === 'den' && (a.so_den || 0) !== (b.so_den || 0)) return ((a.so_den || 0) - (b.so_den || 0)) * dir;
    const da = a[k] || '', db = b[k] || '';
    if (da !== db) return (da < db ? -1 : 1) * dir;
    if ((a.so || 0) !== (b.so || 0)) return ((a.so || 0) - (b.so || 0)) * dir;
    return String(a.created_at || '').localeCompare(String(b.created_at || '')) * dir;
  });
}

  if (pages > 1) { $('#pPrev').onclick = () => { S.page[kind]--; refreshTable(kind); $('#tbl').scrollTop = 0; }; $('#pNext').onclick = () => { S.page[kind]++; refreshTable(kind); $('#tbl').scrollTop = 0; }; }
}
function renderMaBox() {

/* ============================ MODAL ============================== */
function openModal(title, body, foot, cls = '') {
  const bg = document.createElement('div'); bg.className = 'modal-bg';
  bg.innerHTML = `<div class="modal ${cls}"><div class="mh"><b>${title}</b><button class="x" title="Đóng">×</button></div><div class="mb">${body}</div><div class="mf">${foot || ''}</div></div>`;
  document.body.appendChild(bg);
  const close = () => { if (bg._lock) return; bg.remove(); };
  $('.x', bg).onclick = close;
  bg.addEventListener('mousedown', e => { if (e.target === bg) close(); });
  bg.close = () => bg.remove();
  return bg;
}

/* ============================ DANH MỤC: người ký, người nhận, nơi ban hành ============================== */
const DM_LABEL = { nguoi_ky: 'người ký', nguoi_nhan: 'người nhận', noi_ban_hanh: 'nơi ban hành' };
function dmGet(type) {
  const dm = (prefs().danh_muc || {})[type];
  if (Array.isArray(dm)) return dm;
  if (type === 'noi_ban_hanh') return CONFIG.DEFAULT_NOI_BAN_HANH_LIST.slice();
  if (type === 'nguoi_nhan') return S.user ? [S.user.name] : [];
  return [];
}
function dmOptions(type) {
  const fromDocs = ['di', 'den', 'mat'].flatMap(k => (S.docs[k] || []).map(d => d[type])).filter(Boolean);
  return [...new Set([...dmGet(type), ...fromDocs])].sort((a, b) => a.localeCompare(b, 'vi'));
}
async function dmSave(type, list) {
  S.settings.prefs = { ...prefs(), danh_muc: { ...(prefs().danh_muc || {}), [type]: list } };
  await API.saveSettings(S.settings);
}
async function dmAdd(type, v) {
  const list = dmGet(type).slice();
  if (!list.some(x => x.toLowerCase() === v.toLowerCase())) { list.push(v); await dmSave(type, list); }
}
async function addLoai(r) {
  const list = loaiList().map(x => ({ ...x }));
  if (list.some(x => x.ten.toLowerCase() === r.ten.toLowerCase())) return;
  const pl = pad(r.pl || '1', 2);
  list.push({ ten: r.ten, viet_tat: r.viet_tat || '', ky_hieu: r.ky_hieu || (r.viet_tat ? r.viet_tat + '-MTTQ-BTT' : 'MTTQ-BTT'), pl, dvbq: pad(pl, 4) });
  S.settings.loai_map = list; await API.saveSettings(S.settings);
}
/** Hộp nhập nhỏ (dùng cho nút "+") – trả về object hoặc null */
function askFields(title, fields) {
  return new Promise(res => {
    const m = openModal(title, fields.map(f => `<div class="field"><label>${f.label}</label><input data-k="${f.k}" value="${esc(f.value || '')}" placeholder="${esc(f.ph || '')}"></div>`).join(''),
      `<button class="btn" data-c>Hủy</button><button class="btn btn-blue" data-o>+ Thêm</button>`, 'sm');
    const done = v => { m.close(); res(v); };
    $('[data-c]', m).onclick = () => done(null); $('.x', m).onclick = () => done(null);
    const ok = () => { const o = {}; $$('input', m).forEach(i => o[i.dataset.k] = i.value.trim()); if (!o[fields[0].k]) return toast('Vui lòng nhập ' + fields[0].label.toLowerCase(), 'err'); done(o); };
    $('[data-o]', m).onclick = ok;
    $$('input', m).forEach(i => i.onkeydown = e => { if (e.key === 'Enter') { e.preventDefault(); ok(); } });
    setTimeout(() => $('input', m).focus(), 50);
  });
}

/* ============================ THÊM / SỬA ============================== */

    : `<div class="fsec"><div class="fhead"><b>TỆP ĐÍNH KÈM (≤ ${CONFIG.MAX_FILE_MB}MB)</b><button type="button" class="btn btn-sm addf" id="addRow">+ Thêm file</button></div><div class="filelist" id="exist"></div><div id="rows"></div><div id="upMsg" class="small-note"></div></div>`;
  let body = '';
  if (kind === 'di') body = `
    <div class="g3">${inp('nam', 'Năm', 'number', 'min="2000" max="2100"')}${inp('so_vb', 'Số văn bản', 'text', 'placeholder="VD: 18/TTr-MTTQ-BTT"')}${sLoai}</div>
    <div class="field"><div class="lblrow"><label class="lb-blue">🏷️ Mã định danh văn bản</label><span class="hint">Tự động tạo theo mã cơ quan</span></div>
      <div class="sp"><input name="ma_dinh_danh" value="${esc(d.ma_dinh_danh || '')}" class="mono-inp"><button type="button" class="plus regen" id="regen" title="Tạo lại mã định danh">⟳</button></div></div>
    <div class="field"><label>Trích yếu / Nội dung tóm tắt</label><textarea name="trich_yeu">${esc(d.trich_yeu || '')}</textarea></div>
    <div class="g3">${sNoi}${inp('ngay_ky', 'Ngày ký', 'date')}${sKy}</div>${fileSec}`;
  else body = `
    <div class="g4">${inp('nam', 'Năm', 'number', 'min="2000" max="2100"')}
      ${kind === 'den' ? inp('so_den', 'Số đến', 'number', 'min="1" class="soden-inp"')
        : `<div class="field"><label>Độ mật</label><select name="do_mat" class="domat">${DO_MAT.map(x => `<option ${x === d.do_mat ? 'selected' : ''}>${x}</option>`).join('')}</select></div>`}
      ${inp('ngay_nhan', 'Ngày nhận', 'date')}${sNhan}</div>
    <div class="g4">${sLoai}${inp('ngay_ky', 'Ngày ký', 'date')}${sKy}${sNoi}</div>
    <div class="g4">${inp('so_vb', 'Số văn bản')}<div class="field" style="grid-column:span 3"><label>Nội dung tóm tắt</label><input name="trich_yeu" value="${esc(d.trich_yeu || '')}"></div></div>
    ${kind === 'den' ? fileSec : '<div class="small-note">🔒 Văn bản mật chỉ quản lý thông tin sổ đăng ký, không đính kèm tệp lên Internet.</div>'}`;
  const m = openModal(`${isNew ? 'THÊM' : 'SỬA'} ${K.label.toUpperCase()}`, `<form id="docForm" autocomplete="off">${body}</form>`,
    `<button class="btn btn-blue btn-save" id="mSave">Lưu văn bản</button><button class="btn btn-close" id="mCancel">Đóng</button>`, 'form');
  const f = $('#docForm', m);
  const addOpt = (sel, v) => { if (![...sel.options].some(o => o.value === v)) sel.add(new Option(v, v)); sel.value = v; };

  // ---- Nút "+" thêm danh mục ngay trong form ----
  f.addEventListener('click', async e => {
    const b = e.target.closest('[data-add]'); if (!b) return;
    const type = b.dataset.add; const sel = f[b.dataset.for];
    try {
      if (type === 'loai') {
        const r = await askFields('Thêm loại văn bản', [{ k: 'ten', label: 'Tên loại văn bản', ph: 'VD: Công điện' }, { k: 'viet_tat', label: 'Viết tắt (dùng trong mã định danh)', ph: 'VD: CĐ' }, { k: 'ky_hieu', label: 'Ký hiệu mặc định (VB đi)', ph: 'VD: CĐ-MTTQ-BTT' }, { k: 'pl', label: 'PL (2 số)', value: '01' }]);
        if (!r) return; await addLoai(r); addOpt(sel, r.ten); sel.dispatchEvent(new Event('change'));
      } else {
        const r = await askFields('Thêm ' + DM_LABEL[type], [{ k: 'v', label: type === 'noi_ban_hanh' ? 'Tên cơ quan ban hành' : 'Họ và tên ' + DM_LABEL[type], ph: type === 'noi_ban_hanh' ? 'VD: UBND phường' : 'VD: Nguyễn Thị Hồng Nga' }]);
        if (!r) return; await dmAdd(type, r.v); addOpt(sel, r.v);
      }
      toast('Đã thêm vào danh mục', 'ok');
    } catch (err) { toast('Lỗi: ' + err.message, 'err'); }
  });

  // ---- Tệp đính kèm ----
  const existing = (doc && doc.document_files || []).map(x => ({ ...x, _rm: false }));
  const drawExist = () => { const el = $('#exist', m); if (!el) return; el.innerHTML = existing.map((x, i) => `<div><span class="${x._rm ? 'del' : ''}">📎 ${esc(x.file_name)} <span class="muted">${fmtSize(x.size)}${x.released ? ' · đã giải phóng' : ''}</span></span><button type="button" class="rm" data-e="${i}">${x._rm ? '↺ Giữ lại' : '✕ Xóa'}</button></div>`).join(''); };
  drawExist();
  if ($('#exist', m)) $('#exist', m).onclick = e => { const b = e.target.closest('button'); if (b) { existing[+b.dataset.e]._rm = !existing[+b.dataset.e]._rm; drawExist(); } };
  const rowsEl = $('#rows', m);
  const addRow = () => {
    const div = document.createElement('div'); div.className = 'frow';
    div.innerHTML = '<input type="file" multiple><button type="button" class="fx" title="Bỏ tệp">×</button>';
    const fi = $('input', div);
    fi.onchange = () => { const big = [...fi.files].filter(x => x.size > CONFIG.MAX_FILE_MB * 1048576); if (big.length) { toast(`"${big[0].name}" vượt quá ${CONFIG.MAX_FILE_MB} MB.`, 'err', 5000); fi.value = ''; } };
    $('.fx', div).onclick = () => { if ($$('.frow', rowsEl).length > 1) div.remove(); else fi.value = ''; };
    rowsEl.appendChild(div);
  };
  if (rowsEl) { addRow(); $('#addRow', m).onclick = addRow; }

  // ---- Tự động: số văn bản & mã định danh (VB đi) ----
  const parseSo = s => { const mm = String(s || '').match(/^\s*(\d+)\s*\/?\s*(.*)$/); return mm ? { so: +mm[1], ky_hieu: mm[2].trim() } : { so: null, ky_hieu: String(s || '').trim() }; };
  if (kind === 'di') {
    let soAuto = isNew, maTouched = !isNew && !!d.ma_dinh_danh;
    const recompute = () => { if (maTouched) return; const p = parseSo(f.so_vb.value); f.ma_dinh_danh.value = (p.so && f.loai_vb.value) ? makeMa({ so: p.so, nam: f.nam.value, loai_vb: f.loai_vb.value }) : ''; };
    const suggest = () => { if (!soAuto || !f.loai_vb.value) return; f.so_vb.value = `${nextSo('di', f.nam.value, f.loai_vb.value)}/${loaiInfo(f.loai_vb.value).ky_hieu}`; };
    f.loai_vb.onchange = () => { suggest(); recompute(); };
    f.nam.addEventListener('input', () => { suggest(); recompute(); });
    f.so_vb.addEventListener('input', () => { soAuto = false; recompute(); });
    f.ma_dinh_danh.addEventListener('input', () => { maTouched = true; });
    f.ngay_ky.onchange = () => { if (isNew && f.ngay_ky.value && f.ngay_ky.value.slice(0, 4) !== f.nam.value) { f.nam.value = f.ngay_ky.value.slice(0, 4); suggest(); recompute(); } };
    $('#regen', m).onclick = () => { maTouched = false; recompute(); if (!f.ma_dinh_danh.value) toast('Chọn loại văn bản và nhập số văn bản (VD: 18/TTr-MTTQ-BTT) trước.', 'err'); };
  } else {
    f.ngay_nhan.onchange = () => { if (isNew && f.ngay_nhan.value) { const y = f.ngay_nhan.value.slice(0, 4); if (y !== f.nam.value) { f.nam.value = y; if (kind === 'den') f.so_den.value = nextSo('den', y); } } };
  }

  // ---- Lưu ----
  $('#mCancel', m).onclick = () => m.close();
  $('#mSave', m).onclick = async () => {
    const val = n => f[n] ? (f[n].value.trim() || null) : null;
    const need = (n, msg) => { if (!val(n)) { toast(msg, 'err'); f[n].focus(); throw 0; } };
    let p;
    try {
      need('nam', 'Vui lòng nhập năm.');
      if (kind === 'di') { need('loai_vb', 'Vui lòng chọn loại văn bản.'); need('so_vb', 'Vui lòng nhập số văn bản.'); if (!parseSo(f.so_vb.value).so) { toast('Số văn bản phải bắt đầu bằng số, VD: 18/TTr-MTTQ-BTT', 'err'); f.so_vb.focus(); throw 0; } need('ngay_ky', 'Vui lòng chọn ngày ký.'); }
      if (kind === 'den') need('so_den', 'Vui lòng nhập số đến.');
      if (kind !== 'di') { need('ngay_nhan', 'Vui lòng chọn ngày nhận.'); need('so_vb', 'Vui lòng nhập số văn bản.'); }
      need('trich_yeu', kind === 'di' ? 'Vui lòng nhập trích yếu.' : 'Vui lòng nhập nội dung tóm tắt.');
    } catch (e) { return; }
    p = { kind, nam: +f.nam.value, loai_vb: val('loai_vb'), trich_yeu: val('trich_yeu'), noi_ban_hanh: val('noi_ban_hanh'), ngay_ky: val('ngay_ky'), nguoi_ky: val('nguoi_ky'), so_vb: val('so_vb') };
    if (kind === 'di') { const ps = parseSo(f.so_vb.value); const L = loaiInfo(p.loai_vb); Object.assign(p, { so: ps.so, ky_hieu: ps.ky_hieu || null, ma_dinh_danh: val('ma_dinh_danh'), pl: L.pl, dvbq: L.dvbq }); }
    if (kind === 'den') Object.assign(p, { so_den: +f.so_den.value, ngay_nhan: val('ngay_nhan'), nguoi_nhan: val('nguoi_nhan') });
    if (kind === 'mat') Object.assign(p, { do_mat: val('do_mat'), ngay_nhan: val('ngay_nhan'), nguoi_nhan: val('nguoi_nhan') });
    const pending = rowsEl ? $$('input[type=file]', rowsEl).flatMap(i => [...i.files]) : [];
    const dup = (S.docs[kind] || []).find(x => x.id !== (doc && doc.id) && x.nam === p.nam && (kind === 'di' ? (x.loai_vb === p.loai_vb && +x.so === p.so) : kind === 'den' ? +x.so_den === p.so_den : x.so_vb === p.so_vb));
    if (dup && !confirm(`Đã có văn bản trùng số (${kind === 'den' ? 'số đến ' + dup.so_den : dup.so_vb}) trong năm ${p.nam}. Vẫn lưu?`)) return;
    const btn = $('#mSave', m); btn.disabled = true; btn.textContent = 'Đang lưu…'; m._lock = true; S.busy = true; const msg = $('#upMsg', m);
    const errs = [];
    try {
      let id = doc && doc.id;
      if (isNew) id = (await API.insertDoc(p)).id; else await API.updateDoc(id, p);
      for (const x of existing.filter(x => x._rm)) {
        try { if (x.drive_id) await Drive.remove(x.drive_id); await API.deleteFile(x.id); } catch (e) { errs.push(`Xóa ${x.file_name}: ${e.message}`); }
      }
      for (let i = 0; i < pending.length; i++) {
        const file = pending[i]; if (msg) msg.textContent = `⏳ Đang tải lên ${i + 1}/${pending.length}: ${file.name}…`;
        try { const r = await retry(() => Drive.upload(file, { kind, nam: p.nam }), 2); await API.insertFile({ document_id: id, file_name: file.name, drive_id: r.id, mime: file.type || null, size: r.size || file.size }); }
        catch (e) { errs.push(`${file.name}: ${e.message}`); }
      }
      const fresh = await API.getDoc(id);
      const arr = S.docs[kind] || (S.docs[kind] = []); const ix = arr.findIndex(x => x.id === id);
      if (ix >= 0) arr[ix] = fresh; else arr.push(fresh);
      m._lock = false; m.close();
      if (errs.length) toast('Đã lưu văn bản nhưng có lỗi tệp:\n' + errs.join('\n'), 'err', 9000); else toast('Đã lưu văn bản', 'ok');
      if (S.tab === kind) { fillFilterOptions(kind); refreshTable(kind); }
    } catch (e) { toast('Lỗi lưu: ' + e.message, 'err', 7000); btn.disabled = false; btn.textContent = 'Lưu văn bản'; m._lock = false; if (msg) msg.textContent = ''; }
    S.busy = false;
  };
}
async function deleteDoc(kind, doc) {
  if (!doc || !confirm(`Xóa văn bản "${doc.so_vb || doc.so_den}"${(doc.document_files || []).length ? ' và các tệp đính kèm trên Drive' : ''}?\nThao tác này không thể hoàn tác.`)) return;

  rows.forEach((r, i) => aoa.push([...cols.map(c => c[2](r, i)), ...Array.from({ length: maxF }, (_, j) => { const f = (r.document_files || [])[j]; return f ? f.file_name : ''; })]));
  const ws = XLSX.utils.aoa_to_sheet(aoa);

  const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, 'DanhSach');
  return wb;
}

  };
  $('#frKind', m).onchange = info; $('#frYear', m).onchange = info; $('#frDoc', m).onchange = info; info();
  $('#frClose', m).onclick = () => m.close();
  // Tệp đã bị xóa tay trên Drive → coi như đã xóa, vẫn tiếp tục xóa trong Supabase
  const isNotFound = e => /not found|could not be found|no item|không tìm thấy|404/i.test(String(e && e.message || e));
  $('#frGo', m).onclick = async () => {
    const { docs, items } = sel(); const wantDocs = delDocs();
    if (!items.length && !(wantDocs && docs.length)) return toast('Không có gì để xóa.', 'err');
    if (!$('#frChk', m).checked || $('#frTxt', m).value.trim().toUpperCase() !== 'XOA') return toast('Hãy tích xác nhận và gõ XOA.', 'err');
    $('#frGo', m).disabled = true; m._lock = true; S.busy = true; $('#frProg', m).classList.remove('hidden');
    const bar = $('#frBar', m), msg = $('#frMsg', m); let trashOnly = false;
    // 1) Xóa tệp: Drive trước, rồi bản ghi document_files trong Supabase
    await pool(items, 3, async it => {
      const f = it.f;
      if (onDrive(it)) {
        try { const r = await retry(() => Drive.remove(f.drive_id)); if (r && r.permanent === false) trashOnly = true; }
        catch (e) { if (!isNotFound(e)) throw e; }
      }
      await retry(() => API.deleteFile(f.id));
      it.d.document_files = (it.d.document_files || []).filter(x => x.id !== f.id);
      delete it.d._hay;
      it.done = true;
    }, (d, n) => { bar.style.width = d / n * 100 + '%'; msg.textContent = `Đang xóa tệp ${d}/${n}`; });
    const badFiles = items.filter(it => it.error); const okFiles = items.filter(it => it.done).length;
    // 2) Xóa văn bản trong sổ đăng ký (chỉ những văn bản đã xóa hết tệp, để không bỏ sót tệp trên Drive)
    let okDocs = 0, skipped = 0, docErr = '';
    if (wantDocs) {
      const ready = docs.filter(d => !(d.document_files || []).length); skipped = docs.length - ready.length;
      const ids = ready.map(d => d.id);
      for (let i = 0; i < ids.length; i += 100) {
        const chunk = ids.slice(i, i + 100);
        try {
          await retry(() => API.deleteDocs(chunk));
          const gone = new Set(chunk);
          ['di', 'den', 'mat'].forEach(k => { if (S.docs[k]) S.docs[k] = S.docs[k].filter(d => !gone.has(d.id)); });
          okDocs += chunk.length;
        } catch (e) { docErr = e.message; skipped += chunk.length; }
        bar.style.width = (ids.length ? Math.min(i + 100, ids.length) / ids.length * 100 : 100) + '%';
        msg.textContent = `Đang xóa văn bản ${Math.min(i + 100, ids.length)}/${ids.length}`;
      }
    }
    const parts = [`Đã xóa ${okFiles} tệp`]; if (wantDocs) parts.push(`${okDocs} văn bản`);
    msg.innerHTML = `<span class="ok">✅ ${parts.join(' và ')} khỏi Drive & Supabase.</span>`
      + (badFiles.length ? `<br><span class="err">Lỗi ${badFiles.length} tệp: ${esc(badFiles[0].error)}</span>` : '')
      + (skipped ? `<br><span class="err">${skipped} văn bản chưa xóa${docErr ? ': ' + esc(docErr) : ' (còn tệp lỗi)'} – bấm lại để thử tiếp.</span>` : '')
      + (trashOnly ? '<br><span class="err">Tệp đang ở Thùng rác Drive – hãy mở Google Drive và "Dọn sạch thùng rác" để thu hồi dung lượng.</span>' : '');
    S.busy = false; m._lock = false; $('#frGo', m).disabled = false; info();
    if (S.tab === 'dashboard') renderDashboard();
    else if (KIND[S.tab]) { fillFilterOptions(S.tab); refreshTable(S.tab); }
  };
}

/* ============================ QUẢN LÝ KEY / CÀI ĐẶT ============================== */
const SET_TABS = [
  ['drive', '🔗', 'Kết nối Google Drive', 'Nơi lưu tệp đính kèm'],
  ['org', '🏛️', 'Thông tin đơn vị & tài khoản', 'Mã cơ quan, mặc định, mật khẩu'],
  ['dm', '👥', 'Người ký · người nhận · nơi ban hành', 'Danh mục chọn nhanh'],
  ['loai', '📚', 'Loại văn bản & mã định danh', 'Viết tắt, ký hiệu, PL, ĐVBQ']
];
function renderSettings() {
  const st = S.settings; const lm = loaiList().map(x => ({ ...x }));
  if (!SET_TABS.some(t => t[0] === S.setTab)) S.setTab = 'drive';
  const driveOk = Drive.ready() && !DEMO;
  const initials = String(S.user.name || S.user.email || '?').trim().split(/\s+/).slice(-1)[0].charAt(0).toUpperCase();
  const selOpts = (type, cur) => `<option value="">-- Không chọn sẵn --</option>${dmOptions(type).map(x => `<option ${x === cur ? 'selected' : ''}>${esc(x)}</option>`).join('')}`;
  const panel = (id, title, desc, body, foot, extra = '') => `<section class="sx-panel ${S.setTab === id ? '' : 'hidden'}" data-panel="${id}">
      <div class="sx-head"><div><h2>${title}</h2><p>${desc}</p></div>${extra}</div>
      <div class="sx-body">${body}</div>${foot ? `<div class="sx-foot">${foot}</div>` : ''}</section>`;
  $('#view').innerHTML = `<div class="set-wrap" id="setWrap">
    <nav class="set-nav"><div class="nh">Cài đặt</div>
      ${SET_TABS.map(([id, ic, t, sub]) => `<button data-st="${id}" class="${S.setTab === id ? 'on' : ''}"><span class="ic">${ic}</span><span>${t}<small>${sub}</small></span>${id === 'drive' ? `<span class="dot ${driveOk || DEMO ? 'ok' : ''}" id="navDot" title="${driveOk ? 'Đã cấu hình' : 'Chưa cấu hình'}"></span>` : ''}</button>`).join('')}
    </nav>
    <div>
    ${panel('drive', '🔗 Kết nối Google Drive', 'Tệp đính kèm của văn bản đi/đến được lưu trên Google Drive thông qua một Web App Google Apps Script. Mỗi tài khoản có thể dùng Drive riêng (15 GB miễn phí).',
      `<div class="field"><label>Link Web App Google Apps Script</label><input id="sUrl" class="mono-inp" placeholder="https://script.google.com/macros/s/…/exec" value="${esc(st.script_url || '')}"></div>
       <div id="sTestMsg" style="margin:-2px 0 12px;font-size:13px"></div>
       <div class="sx-sec">Hướng dẫn nhanh</div>
       <ol class="steps"><li>Mở <b>script.google.com</b>, tạo dự án mới và dán mã Apps Script (xem file HUONG_DAN.md, bước 3).</li>
         <li>Chọn <b>Triển khai → Bản triển khai mới → Ứng dụng web</b>, quyền truy cập: <b>Bất kỳ ai</b>.</li>
         <li>Sao chép đường link có đuôi <code class="mono">/exec</code>, dán vào ô trên rồi bấm <b>Kiểm tra kết nối</b>.</li></ol>
       ${CONFIG.DEFAULT_SCRIPT_URL ? '<div class="small-note">Để trống sẽ dùng Drive chung của đơn vị.</div>' : ''}`,
      `<button class="btn" id="sTest">🔍 Kiểm tra kết nối</button><button class="btn btn-blue" id="sSaveUrl">💾 Lưu cấu hình</button>`,
      `<span class="stag ${driveOk || DEMO ? 'on' : 'off'}" id="driveTag">${DEMO ? '● Chế độ dùng thử' : driveOk ? '● Đã cấu hình' : '● Chưa cấu hình'}</span>`)}
    ${panel('org', '🏛️ Thông tin đơn vị & tài khoản', 'Mã cơ quan dùng để tạo mã định danh văn bản đi; giá trị mặc định được điền sẵn khi thêm văn bản đi mới.',
      `<div class="sx-sec">Đơn vị</div>
       <div class="field"><label>Mã cơ quan / Phông</label><input id="sMa" class="mono-inp" value="${esc(maCQ())}">
         <div class="ma-prev">📌 Cấu trúc: <code id="maPrev"></code></div></div>
       <div class="g2"><div class="field"><label>Nơi ban hành mặc định (VB đi)</label><select id="sNoi">${selOpts('noi_ban_hanh', prefs().noi_ban_hanh_di)}</select></div>
         <div class="field"><label>Người ký mặc định (VB đi)</label><select id="sKy">${selOpts('nguoi_ky', prefs().nguoi_ky_mac_dinh)}</select></div></div>
       <div class="sx-gap"></div><div class="sx-sec">Tài khoản</div>
       <div class="acc"><div class="av">${esc(initials)}</div><div class="who"><b>${esc(S.user.name)}</b><span>${esc(S.user.email)}</span></div><button class="btn" id="sPw">🔑 Đổi mật khẩu</button></div>
       <div class="small-note" style="margin-top:8px">Dữ liệu, cài đặt và tệp của tài khoản này được lưu riêng, tài khoản khác không xem được.</div>`,
      `<button class="btn" id="sMaDef">Mã mặc định</button><button class="btn btn-blue" id="sSaveOrg">💾 Lưu thông tin</button>`)}
    ${panel('dm', '👥 Danh mục người ký · người nhận · nơi ban hành', 'Các mục ở đây hiện trong ô "-- Chọn --" khi thêm văn bản. Cũng có thể thêm nhanh bằng nút <b>+</b> ngay trong form nhập văn bản. Thay đổi được lưu ngay.',
      `<div class="dm-grid">${['nguoi_ky', 'nguoi_nhan', 'noi_ban_hanh'].map(t => `<div class="dm-col"><div class="dmh"><span>${{ nguoi_ky: '✍️ Người ký', nguoi_nhan: '📨 Người nhận', noi_ban_hanh: '🏛️ Nơi ban hành' }[t]}</span><span class="cnt" data-dmc="${t}">0</span></div>
        <div class="sp"><input data-dmin="${t}" placeholder="Thêm ${DM_LABEL[t]}…"><button class="plus" data-dmadd="${t}" title="Thêm">+</button></div><div class="dmlist" data-dml="${t}"></div></div>`).join('')}</div>`, '')}
    ${panel('loai', '📚 Danh mục loại văn bản & mã định danh', '<b>Viết tắt</b> dùng trong mã định danh; <b>Ký hiệu mặc định</b> dùng cho số văn bản đi (VD: TTr-MTTQ-BTT → "18/TTr-MTTQ-BTT").',
      `<div class="lm-wrap"><table class="mini"><thead><tr><th>#</th><th>Tên loại</th><th>Viết tắt</th><th>Ký hiệu mặc định</th><th>PL (2)</th><th>ĐVBQ (4)</th><th></th></tr></thead><tbody id="lmBody"></tbody></table></div>`,
      `<div class="left"><button class="btn" id="lmAdd">+ Thêm loại</button><button class="btn" id="lmReset">↺ Khôi phục mặc định</button></div><button class="btn btn-blue" id="lmSave">💾 Lưu danh mục</button>`,
      `<span class="stag on" id="lmCount"></span>`)}
    </div></div>`;
  const wrap = $('#setWrap');

  // ---- Chuyển tab con ----
  const refreshOrgSelects = () => { const n = $('#sNoi'), k = $('#sKy'); const nv = n.value || prefs().noi_ban_hanh_di, kv = k.value || prefs().nguoi_ky_mac_dinh; n.innerHTML = selOpts('noi_ban_hanh', nv); k.innerHTML = selOpts('nguoi_ky', kv); };
  $$('.set-nav button', wrap).forEach(b => b.onclick = () => {
    S.setTab = b.dataset.st;
    $$('.set-nav button', wrap).forEach(x => x.classList.toggle('on', x === b));
    $$('[data-panel]', wrap).forEach(p => p.classList.toggle('hidden', p.dataset.panel !== S.setTab));
    if (S.setTab === 'org') refreshOrgSelects();
    b.scrollIntoView({ block: 'nearest', inline: 'nearest' });
  });

  // ---- Danh mục người ký / người nhận / nơi ban hành ----
  const drawDm = t => {
    const list = dmGet(t);
    $(`[data-dml=${t}]`, wrap).innerHTML = list.map((x, i) => `<span class="dmchip">${esc(x)}<button data-dmdel="${t}" data-i="${i}" title="Xóa">×</button></span>`).join('') || '<span class="muted" style="font-size:12px">Chưa có</span>';
    $(`[data-dmc=${t}]`, wrap).textContent = list.length;
  };
  ['nguoi_ky', 'nguoi_nhan', 'noi_ban_hanh'].forEach(drawDm);
  const dmAddFrom = async t => { const el = $(`[data-dmin=${t}]`, wrap); const v = el.value.trim(); if (!v) return; try { await dmAdd(t, v); el.value = ''; drawDm(t); toast('Đã thêm', 'ok'); } catch (e) { toast(e.message, 'err'); } };
  $$('[data-dmadd]', wrap).forEach(b => b.onclick = () => dmAddFrom(b.dataset.dmadd));
  $$('[data-dmin]', wrap).forEach(i => i.onkeydown = e => { if (e.key === 'Enter') dmAddFrom(i.dataset.dmin); });
  wrap.addEventListener('click', async e => { const b = e.target.closest('[data-dmdel]'); if (!b) return; const t = b.dataset.dmdel; const list = dmGet(t).slice(); list.splice(+b.dataset.i, 1); try { await dmSave(t, list); drawDm(t); } catch (err) { toast(err.message, 'err'); } });

  // ---- Danh mục loại văn bản ----
  const draw = () => {
    $('#lmBody').innerHTML = lm.map((x, i) => `<tr><td class="no">${i + 1}</td><td><input data-i="${i}" data-k="ten" value="${esc(x.ten)}" placeholder="Tên loại"></td><td><input data-i="${i}" data-k="viet_tat" value="${esc(x.viet_tat)}" style="min-width:70px"></td><td><input data-i="${i}" data-k="ky_hieu" value="${esc(x.ky_hieu)}" class="mono-inp" style="min-width:150px"></td><td><input data-i="${i}" data-k="pl" value="${esc(x.pl)}" maxlength="2" style="width:60px" class="mono-inp"></td><td><input data-i="${i}" data-k="dvbq" value="${esc(x.dvbq)}" maxlength="4" style="width:80px" class="mono-inp"></td><td><button class="btn btn-sm btn-exit" data-del="${i}" title="Xóa loại này">✕</button></td></tr>`).join('');
    $('#lmCount').textContent = `${lm.length} loại văn bản`;
  };
  draw();
  $('#lmBody').oninput = e => { const t = e.target; if (t.dataset.k) lm[+t.dataset.i][t.dataset.k] = t.value.trim(); };
  $('#lmBody').onclick = e => { const b = e.target.closest('[data-del]'); if (b) { lm.splice(+b.dataset.del, 1); draw(); } };
  $('#lmAdd').onclick = () => { lm.push({ ten: '', viet_tat: '', ky_hieu: 'MTTQ-BTT', pl: '01', dvbq: '0001' }); draw(); const ins = $$('#lmBody input[data-k=ten]'); ins[ins.length - 1].focus(); };
  $('#lmReset').onclick = () => { if (confirm('Khôi phục danh mục mặc định?')) { lm.splice(0, lm.length, ...DEFAULT_LOAI.map(x => ({ ...x }))); draw(); } };
  const save = async (patch, okMsg) => { Object.assign(S.settings, patch); try { await API.saveSettings(S.settings); toast(okMsg, 'ok'); } catch (e) { toast('Lỗi lưu: ' + e.message, 'err'); } };
  $('#lmSave').onclick = () => { const clean = lm.filter(x => x.ten); clean.forEach(x => { x.pl = pad(x.pl || '1', 2); x.dvbq = pad(x.dvbq || '1', 4); }); save({ loai_map: clean }, 'Đã lưu danh mục loại văn bản'); };

  // ---- Thông tin đơn vị ----
  const prevMa = () => { $('#maPrev').textContent = `${$('#sMa').value.trim() || '…'}-[PL(2)]-[ĐVBQ(4)]-[TT(3)]-[KýHiệu]-[SốĐi(4)]-[Năm(4)]`; };
  prevMa(); $('#sMa').oninput = prevMa;
  $('#sMaDef').onclick = () => { $('#sMa').value = CONFIG.DEFAULT_MA_CO_QUAN; prevMa(); };
  $('#sSaveOrg').onclick = () => save({ ma_co_quan: $('#sMa').value.trim(), prefs: { ...prefs(), noi_ban_hanh_di: $('#sNoi').value.trim(), nguoi_ky_mac_dinh: $('#sKy').value.trim() } }, 'Đã lưu thông tin đơn vị');
  $('#sPw').onclick = () => openChangePw(false);

  // ---- Google Drive ----
  const setDriveState = () => { const ok = Drive.ready() && !DEMO; $('#navDot').classList.toggle('ok', ok || DEMO); if (!DEMO) { const tg = $('#driveTag'); tg.className = 'stag ' + (ok ? 'on' : 'off'); tg.textContent = ok ? '● Đã cấu hình' : '● Chưa cấu hình'; } };
  $('#sSaveUrl').onclick = async () => { const u = $('#sUrl').value.trim(); if (u && !/^https:\/\/script\.google\.com\/macros\/s\/.+\/exec$/.test(u)) return toast('Link phải có dạng https://script.google.com/macros/s/…/exec', 'err', 6000); await save({ script_url: u }, 'Đã lưu link Google Drive'); setDriveState(); };
  $('#sTest').onclick = async () => {
    const box = $('#sTestMsg'); const old = S.settings.script_url; const u = $('#sUrl').value.trim(); if (u) S.settings.script_url = u;
    box.textContent = '⏳ Đang kiểm tra…';
    try { await Drive.ping(); const q = await Drive.quota(); box.innerHTML = `<span class="ok">✅ Kết nối thành công. Drive đã dùng ${fmtSize(q.used)} / ${fmtSize(q.limit)}.</span>`; }
    catch (e) { box.innerHTML = `<span class="err">✕ ${esc(e.message)}</span>`; }
    S.settings.script_url = old;
  };
}
function openChangePw(recovery) {
  const m = openModal(recovery ? 'Đặt mật khẩu mới' : 'Đổi mật khẩu', `<div class="field"><label>Mật khẩu mới</label><input type="password" id="np1" minlength="6"></div><div class="field"><label>Nhập lại</label><input type="password" id="np2" minlength="6"></div>`,
    `<button class="btn" id="npC">Hủy</button><button class="btn btn-blue" id="npS">Lưu</button>`, 'sm');
  $('#npC', m).onclick = () => m.close();
  $('#npS', m).onclick = async () => { const a = $('#np1', m).value, b = $('#np2', m).value; if (a.length < 6) return toast('Mật khẩu tối thiểu 6 ký tự', 'err'); if (a !== b) return toast('Hai mật khẩu không khớp', 'err');
    try { await API.updatePw(a); m.close(); toast('Đã đổi mật khẩu', 'ok'); if (recovery) { const u = await API.session(); if (u) enterApp(u); } } catch (e) { toast(e.message, 'err'); } };
}

/* ============================ KHỞI ĐỘNG ============================== */
(async () => {
  if (!DEMO && !window.supabase) { document.body.innerHTML = '<div class="empty err">Không tải được thư viện Supabase. Kiểm tra kết nối mạng rồi tải lại trang.</div>'; return; }
  try { const u = await API.session(); if (u) await enterApp(u); else showAuth(); } catch (e) { showAuth(); toast(e.message, 'err'); }
})();
